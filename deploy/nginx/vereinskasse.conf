# Nginx-Reverse-Proxy fuer die Vereinskasse auf dem Raspberry Pi.
# Frontend: /opt/vereinskasse/frontend/dist
# Backend:  http://127.0.0.1:8000

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kasse.local vereinskasse.local _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name kasse.local vereinskasse.local _;

    ssl_certificate /etc/ssl/certs/vereinskasse.crt;
    ssl_certificate_key /etc/ssl/private/vereinskasse.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:VereinskasseSSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 10m;

    root /opt/vereinskasse/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
